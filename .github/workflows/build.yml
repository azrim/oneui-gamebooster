name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (default: build date)"
        required: false
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module
        run: VERSION="${{ github.event.inputs.version }}" ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: samsung_gamebooster
          path: dist/*.zip
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
